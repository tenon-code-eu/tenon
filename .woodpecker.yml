# CI Woodpecker (Codeberg ou instance auto-hébergée).
# L'image golang:1.26 vient de Docker Hub ; un miroir de registre européen
# peut la remplacer (par exemple registry.example.eu/golang:1.26).
when:
  - event: [push, pull_request]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true
      partial: false

steps:
  - name: ci
    image: golang:1.26
    environment:
      GOPROXY: direct
      GOSUMDB: sum.golang.org
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - make ci
  - name: repro-check
    image: golang:1.26
    environment:
      GOPROXY: direct
      GOSUMDB: sum.golang.org
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - make repro-check
