# CI GitHub Actions (dépôt principal : github.com/tenon-code-eu/tenon).
# Mêmes étapes que .forgejo/workflows/ci.yml et .woodpecker.yml.
# Aucune action tierce (`uses:`) : le dépôt est récupéré par git dans le
# conteneur, avec le jeton du job en lecture seule.
# L'image golang vient de Docker Hub ; golang:1.26.10 est épinglée au dernier
# correctif de Go 1.26 (govulncheck signale des failles de la bibliothèque
# standard dans les versions antérieures) : à relever à chaque correctif de Go.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: golang:1.26.10 # à relever à chaque correctif de Go
    env:
      GOPROXY: direct
      GOSUMDB: sum.golang.org
    steps:
      - name: Récupérer le dépôt
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=Authorization: Basic $auth" fetch -q --tags origin "${{ github.sha }}"
          git checkout -q --detach "${{ github.sha }}"
      - name: Contrôles (vet, test, lint, vuln)
        run: make ci
      - name: Build reproductible
        run: make repro-check

  # Extension VS Code (editors/vscode) : lint, tests unitaires, tests
  # d'intégration dans un vrai VS Code (xvfb) avec le vrai `tenon acp`, puis
  # contrôle de l'empaquetage .vsix. Go vient de l'archive officielle, vérifiée
  # par sa somme SHA-256 épinglée (https://go.dev/dl/?mode=json) : à relever
  # avec l'image golang ci-dessus.
  vscode:
    runs-on: ubuntu-24.04
    container: node:22-bookworm
    env:
      GOPROXY: direct
      GOSUMDB: sum.golang.org
      GOFLAGS: -mod=vendor
      GOTOOLCHAIN: local
    steps:
      - name: Récupérer le dépôt
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=Authorization: Basic $auth" fetch -q --tags origin "${{ github.sha }}"
          git checkout -q --detach "${{ github.sha }}"
      - name: Installer Go 1.26.10
        run: |
          set -eu
          case "$(uname -m)" in
          x86_64) arch=amd64; sum=ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5 ;;
          aarch64) arch=arm64; sum=3f4227ce7b206a513e794f1393adb473a07b46e94d18bd15d1c684bbb7319797 ;;
          *) echo "unsupported machine $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/go.tar.gz "https://go.dev/dl/go1.26.10.linux-$arch.tar.gz"
          echo "$sum  /tmp/go.tar.gz" | sha256sum -c -
          tar -C /usr/local -xzf /tmp/go.tar.gz
          rm /tmp/go.tar.gz
          /usr/local/go/bin/go version
      - name: Paquets système (VS Code sous xvfb, unzip)
        run: |
          set -eu
          apt-get update -q
          apt-get install -y -q xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 unzip
      - name: Dépendances npm (package-lock.json)
        working-directory: editors/vscode
        run: npm ci
      - name: Lint (eslint, tsc)
        working-directory: editors/vscode
        run: npm run lint
      - name: Tests unitaires
        working-directory: editors/vscode
        run: npm test
      - name: Tests d'intégration (VS Code, xvfb)
        working-directory: editors/vscode
        run: PATH="/usr/local/go/bin:$PATH" xvfb-run -a npm run test:integration
      - name: Empaquetage .vsix
        run: sh scripts/vscode-package-check.sh
