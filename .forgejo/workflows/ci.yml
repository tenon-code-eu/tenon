# CI Forgejo Actions (Codeberg ou instance auto-hébergée).
# L'image golang:1.26 vient de Docker Hub ; un miroir de registre européen
# peut la remplacer (par exemple registry.example.eu/golang:1.26).
name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: docker
    container: golang:1.26
    env:
      GOPROXY: direct
      GOSUMDB: sum.golang.org
    steps:
      - name: Récupérer le dépôt
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=Authorization: Basic $auth" fetch -q --tags origin "${{ github.sha }}"
          git checkout -q --detach "${{ github.sha }}"
      - name: Contrôles (vet, test, lint, vuln)
        run: make ci
      - name: Build reproductible
        run: make repro-check
