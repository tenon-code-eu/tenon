# Complete example of the global tenon configuration.
#
# Location: $XDG_CONFIG_HOME/tenon/config.toml,
#           otherwise ~/.config/tenon/config.toml.
# Check:    tenon config check
#
# This file contains no secret. API keys and tokens are read from
# environment variables (named here) or from the system keyring
# (tenon key set <provider>).
#
# Any unknown or misspelled key is refused at load time.
# Missing keys keep their default value.

# Language of the interface and of the system prompt: "en" or "fr".
# Default: "en". Set "fr" for French (or run with --lang fr).
lang = "en"

# Compliance profile: "eu-only" (eu or local providers and MCP servers) or
# "strict-local" (local providers and servers only). A project can only tighten it.
# profile = "eu-only"

# Provider used without --provider. It must exist (preset or [[providers]]).
default_provider = "mistral"

# Maximum number of iterations (model calls) per turn.
max_iterations = 50

# Maximum duration of a shell command, and of an MCP tool call.
shell_timeout = "2m"

# Maximum size (in characters) of a tool output; beyond it, the output is truncated.
output_limit = 30000

# Share of the context window above which the history is summarized.
# Value strictly between 0 and 1.
compaction_threshold = 0.8

[audit]
# "full": content of the events (redacted).
# "metadata": SHA-256 hash and size of each payload, without content.
level = "full"

# --- Providers ------------------------------------------------------------
#
# Built-in presets: mistral, scaleway, ovhcloud, albert, codestral (jurisdiction "eu"),
# ollama and vllm (jurisdiction "local").
#
# A [[providers]] block whose id is the id of a preset REPLACES the whole
# preset: fill in all the fields. Exception: for ollama and vllm, a missing
# model or context_window is still read from the server at startup
# (detect = "off" disables this detection).
#
# jurisdiction means the law that applies to the operator, not the location
# of the servers: "eu", "non-eu" or "local". Without a value, a provider
# declared here is treated as "non-eu". tenon does not verify the value:
# whoever writes it is responsible for it.

[[providers]]
id = "passerelle"                          # name used by --provider
name = "Passerelle interne"                # shown in the banner
base_url = "https://llm.exemple.eu/v1"     # OpenAI-compatible endpoint
api_key_env = "PASSERELLE_API_KEY"         # name of the variable, never the key
model = "mistral-small-latest"
country = "FR"
jurisdiction = "eu"
context_window = 32000                     # in tokens; 32000 if missing

# --- Permissions ----------------------------------------------------------
#
# Defaults: reads inside the project allowed; writes, shell and MCP tools
# need approval; any access outside the project and any read of .env*,
# *.pem or id_rsa* need approval.
#
# tool: read_file, write_file, edit_file, grep, glob, shell,
#       mcp__<server>__<tool>, or "*" for all tools.
# match: pattern where * matches any sequence of characters (/ and spaces
#        included), anchored at the start and at the end. It applies to the
#        path, relative to the project root, for file tools; to the text of
#        the command for shell; to
#        "mcp <server>.<tool> <compact JSON arguments>" for an MCP tool
#        (e.g. mcp gh.create_issue {"title":"x"}). Empty: every call of the tool.
# decision: "allow", "ask" or "deny". deny always wins.
#
# An allow rule on a command never covers a chained command
# (; & | ` $( > < or a line break absent from the pattern).

[[permissions.rules]]
tool = "shell"
match = "go test *"
decision = "allow"

[[permissions.rules]]
tool = "shell"
match = "rm -rf *"
decision = "deny"

# Protecting a directory needs two rules: a path pattern does not apply to
# the text of a command, so "secrets/*" does not block `cat secrets/k`.
# Even so, `cd secrets && cat k` or `cat secr*/k` get through: permissions
# are not a sandbox (see docs/security.md).
[[permissions.rules]]
tool = "*"              # file tools: paths under secrets/
match = "secrets/*"
decision = "deny"

[[permissions.rules]]
tool = "shell"          # commands that mention secrets/
match = "*secrets/*"
decision = "deny"

# --- Redaction ------------------------------------------------------------
#
# Added to the built-in rules (keys and tokens, private keys, IBAN, NIR,
# e-mail, phone number). Go regular expression; the whole match is replaced
# with a marker [<NAME>_<n>], here [TICKET_1], [TICKET_2]…

[[redaction.rules]]
name = "ticket"
pattern = 'TICKET-[0-9]{6}'

# --- MCP servers ----------------------------------------------------------
#
# Declared only here: the configuration of a project cannot add any.
# id: [a-z0-9_-], 32 characters at most. The tools are exposed to the model
# under the name mcp__<id>__<tool>.
#
# risk sets the default permission of the server's tools:
#   "read": allowed without a request;
#   "write", "exec", "network": need approval.
#   Without a value: "exec" for stdio, "network" for http.
#
# A "non-eu" server is neither started nor contacted without --allow-non-eu.

# Stdio server: a local program started by tenon.
[[mcp.servers]]
id = "docs"
transport = "stdio"
# Absolute path, or bare name looked up in the absolute directories of PATH.
command = ["mcp-docs-server", "--readonly"]
# Variables passed to the server, in addition to PATH, HOME, LANG and
# TENON_PROJECT_ROOT. Their values are redacted everywhere.
env_from = ["DOCS_INDEX_TOKEN"]
# Default "local" for a stdio server. Declare "non-eu" if it relays a
# service located outside the EU.
jurisdiction = "local"
risk = "read"
# Optional allowlist of the exposed tools.
tools = ["search", "fetch_page"]

# HTTP server (MCP "streamable HTTP").
[[mcp.servers]]
id = "tickets"
transport = "http"
# https is mandatory, except to localhost, 127.0.0.1 or ::1.
# No credentials, no query and no fragment in the URL.
url = "https://mcp.exemple.eu/mcp"
# Name of the variable that holds the token sent as "Authorization: Bearer".
bearer_env = "TICKETS_MCP_TOKEN"
# Mandatory for an http server.
jurisdiction = "eu"
country = "FR"
risk = "network"
# true: server declared but neither started nor contacted.
disabled = false

# Hooks: commands run at precise moments (see docs/usage.md#hooks).
# The hooks themselves are in ~/.config/tenon/hooks.json. This section is
# global only: it is refused in .tenon/config.toml.
# [hooks]
# true: also reads the "hooks" key of ~/.claude/settings.json.
# claude_settings = false
# true: no hook is loaded or run.
# disabled = false

# Checkpoints: copies of files taken before write_file and edit_file change
# them, for /rewind (see docs/usage.md#checkpoints-and-rewind). The copies
# hold the raw file content, secrets included. This section is global only:
# it is refused in .tenon/config.toml.
# [checkpoints]
# Days to keep the copies. 0: no copy is saved and /rewind cannot restore files.
# retention_days = 30

# Provider allowlist: restricts the hosts providers may use. Present lists
# (organisation policy, global, project) must all accept the host. Entries:
# "x.eu" (exact) or "*.x.eu" (subdomains only); no scheme, port or path.
# local = true also admits local hosts. An empty list is refused. In
# .tenon/config.toml the section can only restrict further.
# [provider_allowlist]
# hosts = ["api.example.eu", "*.llm.example.eu"]
# local = true

# Declared qualifications (providers and MCP servers): "secnumcloud" is the
# only accepted value. Declarative, never verified; used by the secnumcloud
# profile for "eu" jurisdictions. Ignored under an organisation policy.
# [[providers]]
# id = "sovereign"
# base_url = "https://llm.example.eu/v1"
# jurisdiction = "eu"
# qualifications = ["secnumcloud"]
