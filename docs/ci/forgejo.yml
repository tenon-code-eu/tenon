# tenon in Forgejo Actions or Gitea Actions (Codeberg or self-hosted).
#
# Copy it to .forgejo/workflows/tenon.yml (or .gitea/workflows/) and
# ci/tenon.toml next to your code (see docs/ci.md).
#
# Secrets to define in the repository settings:
#   MISTRAL_API_KEY  the provider key.
# Never expose it to pull requests from forks: a fork author controls
# ci/tenon.toml and the task. The condition below skips them.
#
# The exit code of the job is the exit code of tenon (0, 1, 3 or 4).
name: tenon
on:
  workflow_dispatch:
    inputs:
      task:
        description: Task given to tenon
        required: true
  pull_request:

jobs:
  tenon:
    # "docker" is the default label of forgejo-runner. Gitea act_runner and
    # Codeberg use other labels: set the one of your runner.
    runs-on: docker
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Debian-based image with Go; the tag is pinned, raise it when Go ships a fix.
    container: golang:1.26.9-bookworm
    env:
      TENON_TASK: ${{ github.event.inputs.task || 'Review the changes of this pull request and run the tests.' }}
      XDG_DATA_HOME: ${{ github.workspace }}/.tenon-data
    steps:
      - name: Fetch the repository
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=Authorization: Basic $auth" fetch -q origin "${{ github.sha }}"
          git checkout -q --detach "${{ github.sha }}"
      - name: Install tenon
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl minisign nodejs
          # Pinned version; the signature is mandatory.
          # To install from a mirror, uncomment the next line. The signature is
          # still verified, so a compromised mirror cannot serve a forged binary.
          # export TENON_DOWNLOAD_BASE="https://mirror.example.eu/tenon"
          # For an air-gapped or mirror install, also fetch install.sh itself from
          # the mirror (or vendor it in your repository) and pin it with a
          # "sha256sum -c" check: it carries the minisign public key.
          curl -fsSL -o install.sh https://raw.githubusercontent.com/tenon-code-eu/tenon/v0.7.0/install.sh
          TENON_VERSION=v0.7.0 TENON_REQUIRE_SIGNATURE=1 sh install.sh
      - name: Run tenon
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          rc=0
          tenon --config ci/tenon.toml -p "$TENON_TASK" --strict --output json > tenon-events.jsonl || rc=$?
          exit "$rc"
      - name: Verify and export the audit log
        if: always()
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          # The run step already fails the job on a tenon error; verify and
          # export always run to archive the evidence.
          vrc=0
          tenon --config ci/tenon.toml audit verify || vrc=$?
          tenon --config ci/tenon.toml audit export --all-projects --out tenon-audit
          exit "$vrc"
      - name: Archive the evidence
        if: always()
        # Consider pinning actions by commit SHA for stronger supply-chain guarantees.
        # Needs node in the container (installed above). Use v3: v4 is not
        # supported by Forgejo and Gitea runners.
        uses: actions/upload-artifact@v3.2.1
        with:
          name: tenon-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
          path: |
            tenon-events.jsonl
            tenon-audit/
            .tenon-data/tenon/audit/
